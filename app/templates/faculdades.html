<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculdades | SuaFacul</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <script src="/static/js/theme.js"></script>
    <link rel="stylesheet" href="/static/css/components/header.css">
    <link rel="stylesheet" href="/static/css/components/footer.css">
    <link rel="stylesheet" href="/static/css/components/curso-autocomplete.css">
    <link rel="stylesheet" href="/static/css/pages/faculdades.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    {% set nav_variant = 'public' %}
    {% set active_page = 'faculdades' %}
    {% include 'partials/_header.html' %}

    <main>
        <section class="hero">
            <h1>Encontre a sua <em><strong>faculdade</strong></em> ideal!</h1>
            <div class="container">
                <div class="container-input">
                    <div class="card">
                        <label for="curso"> Qual curso deseja estudar?</label>
                        <input type="text" class="text-input" placeholder="Digite o curso">
                        <div class="filtros1">
                            <label><input type="checkbox"> Presencial</label>
                            <label><input type="checkbox"> Híbrido</label>
                            <label><input type="checkbox"> EaD</label>
                        </div>
                    </div>
                    <div class="card">
                        <label for="faculdade"> Em qual faculdade?</label>
                        <input type="text" class="text-input" placeholder="Digite a faculdade">
                        <div class="filtros">
                            <label><input type="radio">Pública</label>
                            <label><input type="radio">Particular</label>
                        </div>
                    </div>
                    <div class="card">
                        <label for="cidade">Em que cidade quer estudar?</label>
                        <input type="text" class="text-input" placeholder="Digite a cidade">
                        <div class="filtros">
                            <button class="btn-buscar">Buscar</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Seção de Resultados (será criada dinamicamente pelo JavaScript) -->
        <section class="results-section" style="display: none;">
            <div class="container">
                <div class="results-header">
                    <h2><i class="fas fa-search"></i> Resultados da Busca</h2>
                    <div class="results-count">0-0 de 0 faculdades encontradas</div>
                </div>
                <div class="courses-grid">
                    <!-- Os cursos serão carregados dinamicamente via JavaScript -->
                </div>
                <div class="pagination">
                    <!-- A paginação será gerada dinamicamente via JavaScript -->
                </div>
            </div>
        </section>
    </main>

    {% include 'partials/_footer.html' %}
    <script src="/static/js/header.js"></script>
    <script src="/static/js/favoritos.js"></script>
    <script src="/static/js/faculdades.js"></script>
    <script src="/static/js/curso-autocomplete.js"></script>
</body>
</html>
