<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Favoritos | SuaFacul</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components/header.css">
    <link rel="stylesheet" href="/static/css/components/footer.css">
    <link rel="stylesheet" href="/static/css/pages/cursos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        .favorites-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--light-bg);
        }
        .favorites-tabs button {
            padding: 1rem 2rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--text-light);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
        }
        .favorites-tabs button.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        .favorites-tabs button:hover {
            color: var(--primary-dark);
        }
        .favorites-content {
            display: none;
        }
        .favorites-content.active {
            display: block;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: var(--primary-light);
        }
        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }
    </style>
</head>
<body>
    {% set nav_variant = 'favoritos' %}
    {% set active_page = 'favoritos' %}
    {% include 'partials/_header.html' %}

    <main>
        <section class="courses-section">
            <div class="container">
                <div class="courses-header">
                    <h2><i class="fas fa-heart"></i> Meus Favoritos</h2>
                </div>

                <div class="favorites-tabs">
                    <button class="tab-button active" data-tab="cursos">
                        <i class="fas fa-book"></i> Cursos
                    </button>
                    <button class="tab-button" data-tab="vestibulares">
                        <i class="fas fa-clipboard-list"></i> Vestibulares
                    </button>
                    <button class="tab-button" data-tab="faculdades">
                        <i class="fas fa-university"></i> Faculdades
                    </button>
                </div>

                <div id="cursos-content" class="favorites-content active">
                    <div class="courses-grid" id="cursos-grid">
                        <!-- Cursos favoritos serão carregados aqui -->
                    </div>
                </div>

                <div id="vestibulares-content" class="favorites-content">
                    <div class="courses-grid" id="vestibulares-grid">
                        <!-- Vestibulares favoritos serão carregados aqui -->
                    </div>
                </div>

                <div id="faculdades-content" class="favorites-content">
                    <div class="courses-grid" id="faculdades-grid">
                        <!-- Faculdades favoritas serão carregadas aqui -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    {% include 'partials/_footer.html' %}

    <script src="/static/js/header.js"></script>
    <script src="/static/js/favoritos.js"></script>
    <script src="/static/js/favoritos-page.js"></script>
</body>
</html>
